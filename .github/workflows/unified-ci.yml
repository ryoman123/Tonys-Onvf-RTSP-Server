name: Unified Grand Design CI

on:
  push:
    branches:
      - unified-grand-design
  pull_request:
    branches:
      - main
      - unified-grand-design

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lifecycle-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask flask-cors requests werkzeug pyyaml psutil

      - name: Compile application
        run: python -m compileall -q app run.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Render UI and test browser stream selection
        run: python tools/ui_feature_smoke.py
